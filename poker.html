<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Четыре собаки играют в покер</title>
<meta name="description" content="Покерный клуб для своих: техасский холдем на виртуальные фишки, турниры и джаз на фоне.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{
  --room:#120f0c;        /* стены клуба */
  --panel:#1d1813;       /* панели */
  --panel2:#262019;
  --line:#3a3026;
  --ink:#f4ecdc;         /* основной текст */
  --dim:#b2a58f;
  --brass:#d9a441;       /* латунь, акцент */
  --brass-ink:#2a1b04;
  --felt:#0f5a43;        /* сукно */
  --felt-dark:#083528;
  --rail:#3b2416;        /* борт стола */
  --red:#c63a3f;
  --ok:#6fcf97;
  --warn:#e9a04b;
  --card:#fbf6ea;
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--room);color:var(--ink)}
body{overflow-x:clip;font-family:var(--font-body);font-size:15px;line-height:1.45;
  background:radial-gradient(1200px 600px at 50% -10%,#2a1f14 0%,transparent 60%),var(--room);
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Шапка */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .dogs{font-size:24px;letter-spacing:-3px}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(17px,3.4vw,24px);line-height:1.1;margin:0;letter-spacing:-.01em}
h1 span{color:var(--brass)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chipbal{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:700;font-variant-numeric:tabular-nums}
.chipbal .ava{width:28px;height:28px;font-size:17px}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe3a1,var(--brass) 60%,#8a5f17);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);vertical-align:-2px}
nav{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--dim)}
.tab[aria-current="page"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.tab:hover{color:var(--ink)}
a.back{color:var(--dim);font-size:13px;text-decoration:none}
a.back:hover{color:var(--ink)}

.btn{white-space:nowrap;border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;transition:transform .1s,filter .1s;background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.gold{background:var(--brass);color:var(--brass-ink);box-shadow:none}
.btn.red{background:var(--red);color:#fff;box-shadow:none}
.btn.green{background:#1f8a5f;color:#fff;box-shadow:none}
.btn.small{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.box h2{font-family:var(--font-display);font-weight:600;font-size:15px;margin:0 0 12px}
.muted{color:var(--dim)}
.small{font-size:13px}
input[type=text],input[type=number],input[type=url],select{background:#0f0c09;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input[type=range]{accent-color:var(--brass);width:100%}

/* Лобби */
.lobby{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.tcard{position:relative;overflow:hidden;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;
  background:radial-gradient(130% 90% at 50% 0%,#167257 0%,var(--felt) 45%,var(--felt-dark) 100%);border:6px solid var(--rail);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.35)}
.tcard h3{margin:0;font-family:var(--font-display);font-size:20px}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.28);color:#e7f2ea}
.pill.live{background:rgba(233,160,75,.22);color:#ffd59b}
.faces{display:flex;gap:4px;min-height:32px;flex-wrap:wrap}
.faces .ava{width:30px;height:30px;font-size:17px}
.tcard .btn{align-self:flex-start}

/* Аватар */
.ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:#2c241b;overflow:hidden;flex:none;line-height:1}
.ava img{width:100%;height:100%;object-fit:cover;display:block}

/* Стол */
.tableview{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
@media (max-width:900px){.tableview{grid-template-columns:minmax(0,1fr)}}
.tablebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.tablebar h2{margin:0;font-family:var(--font-display);font-size:18px}
.tablebar .acts{display:flex;gap:6px;flex-wrap:wrap}
.felt-wrap{position:relative;width:100%;aspect-ratio:16/10;margin:28px 0 30px}
@media (max-width:640px){.felt-wrap{aspect-ratio:5/6;margin:34px 0 44px}.brand .dogs{display:none}a.back{font-size:12px}}
.felt{position:absolute;inset:6% 8%;border-radius:50%/50%;
  background:radial-gradient(70% 60% at 50% 40%,#1a7a5c 0%,var(--felt) 50%,var(--felt-dark) 100%);
  border:14px solid var(--rail);box-shadow:inset 0 0 0 2px #6b4527,inset 0 0 60px rgba(0,0,0,.55),0 20px 50px rgba(0,0,0,.5),0 0 0 3px #1c110a}
@media (max-width:640px){.felt{inset:6% 9%;border-width:10px}}
.felt::after{content:"ЧЕТЫРЕ СОБАКИ";position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--font-display);font-weight:800;font-size:clamp(9px,1.5vw,13px);letter-spacing:.35em;color:rgba(255,255,255,.07);white-space:nowrap}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:70%}
.board{display:flex;gap:clamp(3px,.8vw,7px);justify-content:center}
.pot{font-weight:800;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:999px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.stage{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.banner{background:rgba(10,8,6,.82);border:1px solid rgba(217,164,65,.5);color:var(--ink);padding:8px 12px;border-radius:12px;text-align:center;font-size:13px;font-weight:700;max-width:100%}
.banner b{color:var(--brass)}

/* Карты */
.card{width:clamp(30px,5.2vw,52px);aspect-ratio:5/7;border-radius:clamp(4px,.6vw,7px);background:var(--card);color:#1b1b1b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);position:relative;flex:none}
.card .r{font-size:clamp(13px,2vw,20px);letter-spacing:-.04em}
.card .s{font-size:clamp(12px,1.9vw,19px);margin-top:1px}
.card.red{color:var(--red)}
.card.slot{background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
.card.back{background:repeating-linear-gradient(45deg,#7a1f2a 0 5px,#8f2833 5px 10px);box-shadow:inset 0 0 0 2px #f2e3c6,0 2px 6px rgba(0,0,0,.35)}
.card.win{box-shadow:0 0 0 3px var(--brass),0 2px 8px rgba(0,0,0,.4)}
.card.big{width:clamp(54px,9vw,78px)}
.card.big .r{font-size:clamp(20px,3.2vw,30px)}
.card.big .s{font-size:clamp(18px,3vw,28px)}
.card.deal{animation:deal .35s ease-out both}
@keyframes deal{from{transform:translateY(-14px) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* Места */
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:clamp(78px,12vw,116px);z-index:2}
.seat .ava{width:clamp(38px,5.4vw,54px);height:clamp(38px,5.4vw,54px);font-size:clamp(20px,3vw,30px);box-shadow:0 0 0 3px #1c140d,0 6px 14px rgba(0,0,0,.45);position:relative}
.seat.turn .ava{box-shadow:0 0 0 3px var(--brass),0 0 22px rgba(217,164,65,.7)}
.seat.folded .ava,.seat.out .ava{filter:grayscale(1) brightness(.6)}
.seat.winner .ava{box-shadow:0 0 0 3px var(--ok),0 0 24px rgba(111,207,151,.7)}
.plate{background:rgba(12,10,8,.9);border:1px solid var(--line);border-radius:10px;padding:3px 8px;text-align:center;min-width:100%;max-width:100%}
.plate.me b{color:var(--brass)}
.plate b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--brass);font-weight:800}
.timer{height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;width:100%;margin-top:2px}
.timer i{display:block;height:100%;background:var(--brass);transition:width .25s linear}
.lastact{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#f4ecdc;color:#1d150b;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.lastact.fold{background:#4b4036;color:#cfc3b0}
.lastact.allin{background:var(--red);color:#fff}
.seat .mini-cards{display:flex;position:absolute;top:50%;left:calc(100% - 6px);transform:translateY(-50%)}
.seat .mini-cards .card{width:clamp(14px,2vw,21px)}
.seat .mini-cards .card+.card{margin-left:-7px;transform:rotate(8deg)}
.seat .mini-cards .card .r{font-size:clamp(9px,1.2vw,12px)}
.seat .mini-cards .card .s{font-size:clamp(8px,1.1vw,11px)}
.seat .shown{display:flex;gap:3px}
.seat .shown .card{width:clamp(26px,3.8vw,38px)}
.dealer{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;font-weight:900;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.4);transform:translate(-50%,-50%);z-index:3}
.betchip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.45);padding:2px 8px 2px 3px;border-radius:999px;z-index:1;white-space:nowrap}
.emptyseat{position:absolute;transform:translate(-50%,-50%);z-index:2}
.emptyseat button{width:clamp(40px,5.4vw,54px);height:clamp(40px,5.4vw,54px);border-radius:50%;border:2px dashed rgba(255,255,255,.28);background:rgba(0,0,0,.25);color:rgba(255,255,255,.7);font-size:11px;font-weight:800;cursor:pointer}
.emptyseat button:hover{border-color:var(--brass);color:var(--brass)}
.emptyseat span{display:block;width:clamp(40px,5.4vw,54px);height:clamp(40px,5.4vw,54px);border-radius:50%;border:2px dashed rgba(255,255,255,.12)}
.won-float{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-weight:900;color:var(--ok);font-size:13px;white-space:nowrap;text-shadow:0 1px 3px #000;animation:pop .5s ease-out both}
@keyframes pop{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* Мои карты и действия */
.myzone{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.myhand{display:flex;align-items:center;gap:12px;min-width:0}
.myhand .cards{display:flex;gap:6px}
.myhand .what{display:flex;flex-direction:column;min-width:0}
.myhand .what b{font-family:var(--font-display);font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;flex:1;min-width:260px}
.raise{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1;max-width:360px}
.raise .presets{display:flex;gap:5px;flex-wrap:wrap}
.raise .row{display:flex;gap:6px;align-items:center}
.raise input[type=number]{width:110px}
.waitline{color:var(--dim);font-weight:700}
.side{display:flex;flex-direction:column;gap:14px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px;max-height:320px;overflow:auto}
.log li{padding:5px 0;border-top:1px solid var(--line);color:var(--dim)}
.log li:first-child{border-top:0;color:var(--ink)}
.tinfo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}

/* Профиль */
.profile{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.profile{grid-template-columns:minmax(0,1fr)}}
.avagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:10px 0}
.avagrid button{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:var(--panel2);font-size:24px;cursor:pointer;padding:0;display:grid;place-items:center;overflow:hidden}
.avagrid button[aria-pressed="true"]{border-color:var(--brass);background:#3a2d17}
.avagrid img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.combos{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.combo{display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.combo .bar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.combo .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),#f1cf83);border-radius:5px}
.combo b{text-align:right;font-variant-numeric:tabular-nums}

/* Рейтинг и банк */
.rows{display:flex;flex-direction:column}
.urow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);flex-wrap:wrap}
.urow:first-child{border-top:0}
.urow .nm{flex:1;min-width:120px;font-weight:700;overflow-wrap:anywhere}
.urow .nm small{display:block;font-weight:600;color:var(--dim);font-size:12px}
.urow .num{font-variant-numeric:tabular-nums;font-weight:800}
.place{width:26px;text-align:center;font-weight:800;color:var(--dim)}
.bankctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bankctl input{width:110px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.radiolist{display:flex;flex-direction:column;gap:6px}
.radiolist .r{display:flex;gap:6px}
.radiolist .r input{flex:1}

/* Радио */
.radio{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.radio .knob{display:flex;align-items:center;gap:8px;border-radius:999px;padding:9px 14px 9px 10px;background:#1b140d;border:1px solid var(--brass);color:var(--ink);font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.radio .knob .eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.radio .knob .eq i{width:3px;background:var(--brass);height:4px;border-radius:1px}
.radio.playing .knob .eq i{animation:eq .9s ease-in-out infinite}
.radio.playing .knob .eq i:nth-child(2){animation-delay:.2s}.radio.playing .knob .eq i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.radio .panel{width:min(300px,calc(100vw - 28px));background:#1b140d;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.55)}
.radio .panel h3{margin:0;font-family:var(--font-display);font-size:14px}
.stations{display:flex;flex-direction:column;gap:5px}
.stations button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:700}
.stations button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
#ytbox{position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden}

/* Диалог */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:18px;width:min(380px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 10px;font-family:var(--font-display);font-size:16px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.buyval{font-family:var(--font-display);font-size:24px;color:var(--brass);font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:var(--ink);color:#1d150b;font-weight:800;font-size:14px;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;z-index:40;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.gate{max-width:560px;margin:30px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.gate .dogs{font-size:54px;letter-spacing:-12px}
.gate p{margin:0;color:var(--dim)}
.setup{display:flex;gap:8px;width:100%}
.setup input{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="dogs" aria-hidden="true">🐕🐩🦮🐶</div>
      <h1>Четыре собаки<br><span>играют в покер</span></h1>
    </div>
    <div class="who">
      <a class="back" href="./index.html">← Кино-рулетка</a>
      <span class="chipbal" id="meChip" hidden></span>
      <button class="btn small" id="authBtn" type="button">Войти через Google</button>
    </div>
  </header>
  <nav id="nav" hidden>
    <button class="tab" data-view="lobby" type="button">Столы</button>
    <button class="tab" data-view="profile" type="button">Профиль</button>
    <button class="tab" data-view="top" type="button">Рейтинг</button>
    <button class="tab" data-view="bank" type="button" id="bankTab" hidden>Банк</button>
  </nav>
  <main id="main"></main>
</div>

<div class="radio" id="radio">
  <div class="panel" id="radioPanel" hidden>
    <h3>Радио клуба</h3>
    <div class="stations" id="stations"></div>
    <label class="small muted">Громкость <input type="range" id="vol" min="0" max="100" value="45"></label>
    <div class="small muted" id="radioNote">Музыка играет только у тебя, у каждого своя.</div>
  </div>
  <button class="knob" id="radioKnob" type="button" aria-expanded="false"><span class="eq"><i></i><i></i><i></i></span><span id="radioLabel">Радио</span></button>
</div>
<div id="ytbox"><div id="yt"></div></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(() => {

const SUIT = { s: "♠", h: "♥", d: "♦", c: "♣" };
function cardHtml(c, cls = "") {
  if (!c) return `<span class="card slot ${cls}"></span>`;

}
const RANKS = "23456789TJQKA";
function score5(cs) {
  const v = cs.map((c) => RANKS.indexOf(c[0]) + 2).sort((a, b) => b - a);
  const flush = cs.every((c) => c[1] === cs[0][1]);
  const uniq = [...new Set(v)]; let sh = 0;
  if (uniq.length === 5) { if (v[0] - v[4] === 4) sh = v[0]; else if (v[0] === 14 && v[1] === 5) sh = 5; }
  if (sh && flush) return [8, sh];
  const cnt = {}; for (const x of v) cnt[x] = (cnt[x] || 0) + 1;
  const g = Object.entries(cnt).map(([r, n]) => [n, +r]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);
  if (g[0][0] === 4) return [7, g[0][1]];
  if (g[0][0] === 3 && g[1][0] === 2) return [6, g[0][1]];
  if (flush) return [5, ...v];
  if (sh) return [4, sh];
  if (g[0][0] === 3) return [3, g[0][1]];
  if (g[0][0] === 2 && g[1][0] === 2) return [2, g[0][1], g[1][1]];
  if (g[0][0] === 2) return [1, g[0][1]];
  return [0, ...v];
}
function bestName(cards) {
  if (cards.length < 2) return "";
  if (cards.length < 5) return cards[0][0] === cards[1][0] ? "Пара" : "Старшая карта";
  const better = (a, b) => { for (let i = 0; i < Math.max(a.length, b.length); i++) { const d = (a[i] || 0) - (b[i] || 0); if (d) return d > 0; } return false; };
  let best = null;
  const pick = (start, chosen) => {
    if (chosen.length === 5) { const s = score5(chosen); if (!best || better(s, best)) best = s; return; }
    for (let i = start; i < cards.length; i++) pick(i + 1, chosen.concat([cards[i]]));
  };
  pick(0, []);
  return HAND_NAMES[best[0] === 8 && best[1] === 14 ? 9 : best[0]];
}

}

  if (p.stage === "showdown" && p.results.length) banner = p.results.map((r) => `<b>${esc(r.name)}</b> +${fmt(r.amount)}${r.hand ? " · " + esc(r.hand) : ""}`).join("<br>");

    const s = p.seats[i], pos = seatPos(i, base);
    if (!s) {
      const canSit = mine < 0 && S.user && (t.type === "cash" || p.tourney.status === "waiting");
      html += `<div class="emptyseat" style="left:${pos.x}%;top:${pos.y}%">${canSit ? `<button type="button" data-sit="${i}">Сесть</button>` : `<span></span>`}</div>`;
      continue;
    }
    const turn = BETTING.includes(p.stage) && p.toAct === i;
    const cls = ["seat", turn && "turn", s.inHand && s.folded && "folded", (s.sittingOut || !s.inHand && BETTING.includes(p.stage)) && "out", winners.has(i) && "winner"].filter(Boolean).join(" ");
    const last = s.last || (s.sittingOut ? "Отошёл" : "");
    const lastCls = /^Пас/.test(last) ? "fold" : /^Олл-ин/.test(last) ? "allin" : "";
    let cardsHtml = "";
    if (s.shown && s.shown.length && p.stage === "showdown") cardsHtml = `<div class="shown">${s.shown.map((c) => cardHtml(c, winCards.has(c) ? "win" : "")).join("")}</div>`;
    else if (s.inHand && !s.folded && BETTING.includes(p.stage) && i !== mine) cardsHtml = `<div class="mini-cards"><span class="card back"></span><span class="card back"></span></div>`;
    const remain = turn && p.deadline ? Math.max(0, p.deadline - now()) : 0;
    html += `<div class="${cls}" style="left:${pos.x}%;top:${pos.y}%" data-seat="${i}">
      ${p.stage === "showdown" && s.won ? `<div class="won-float">+${fmt(s.won)}</div>` : ""}
      <div style="position:relative">${avaHtml(s)}${cardsHtml.includes("mini-cards") ? cardsHtml : ""}</div>
      ${cardsHtml && !cardsHtml.includes("mini-cards") ? cardsHtml : ""}
      <div class="plate${i === mine ? " me" : ""}"><b>${esc(s.name)}</b><span>${s.allin && BETTING.includes(p.stage) ? "олл-ин" : fmt(s.stack)}</span>${turn ? `<div class="timer"><i data-timer style="width:${(remain / TURN_MS) * 100}%"></i></div>` : ""}</div>
      ${last ? `<div class="lastact ${lastCls}">${esc(last)}</div>` : ""}
    </div>`;
    if (s.bet > 0 && BETTING.includes(p.stage)) html += `<div class="betchip" style="left:${pos.bx}%;top:${pos.by}%"><span class="coin"></span>${fmt(s.bet)}</div>`;
    if (p.button === i && p.stage !== "idle") html += `<div class="dealer" style="left:${pos.dx}%;top:${pos.dy}%">D</div>`;
  }
  $("felt").innerHTML = html;
  $("felt").querySelectorAll("[data-sit]").forEach((b) => (b.onclick = () => sitDialog(t, p, +b.dataset.sit)));

  // информация и лог
  const seated = p.seats.filter(Boolean);
  let info = "";
  if (t.type === "tourney") {
    const tr = p.tourney;
    const left = seated.filter((s) => s.stack > 0 || tr.status !== "running").length;
    info = `<h2>Турнир</h2><div class="tinfo">
      <div class="stat"><b>${tr.status === "running" ? "Идёт" : tr.status === "finished" ? "Финиш" : "Запись"}</b><span>статус</span></div>
      <div class="stat"><b>${p.sb}/${p.bb}</b><span>блайнды, уровень ${(tr.level || 0) + 1}</span></div>
      <div class="stat"><b>${tr.status === "waiting" ? seated.length : left}</b><span>${tr.status === "waiting" ? "записались" : "в игре"}</span></div>
      <div class="stat"><b>${tr.status === "running" ? Math.max(0, 8 - (tr.handsAtLevel || 0)) : "—"}</b><span>раздач до роста блайндов</span></div></div>
      ${tr.busted.length ? `<div class="rows" style="margin-top:10px">${tr.busted.slice().sort((a, b) => a.place - b.place).map((b) => `<div class="urow"><span class="place">${b.place}</span>${avaHtml(b)}<span class="nm">${esc(b.name)}</span></div>`).join("")}</div>` : ""}`;
  } else {
    info = `<h2>Стол</h2><div class="tinfo">
      <div class="stat"><b>${p.sb}/${p.bb}</b><span>блайнды</span></div>
      <div class="stat"><b>${seated.length}/9</b><span>за столом</span></div>
      <div class="stat"><b>${fmt(t.minBuy)}</b><span>мин. вход</span></div>
      <div class="stat"><b>${fmt(t.maxBuy)}</b><span>макс. вход</span></div></div>`;
  }
  $("tInfo").innerHTML = info;
  $("log").innerHTML = p.log.slice().reverse().map((l) => `<li>${esc(l)}</li>`).join("") || `<li>Пока тихо</li>`;
  renderMyZone(p, t, mine);
  maybeNotifyTurn(p, mine);
  scheduleTick(p, mine);
}

function renderMyZone(p, t, mine) {
  const z = $("myzone"); if (!z) return;
  const s = mine >= 0 ? p.seats[mine] : null;
  const hole = s && s.inHand && (BETTING.includes(p.stage) || p.stage === "showdown") ? (S.hand || []) : [];
  const name = hole.length === 2 ? bestName(hole.concat(p.board)) : "";
  const handPart = `<div class="myhand"><div class="cards">${hole.length ? hole.map((c) => cardHtml(c, "big" + (s.folded ? "" : " deal"))).join("") : cardHtml(null, "big") + cardHtml(null, "big")}</div>
    <div class="what">${s ? `<b>${hole.length ? esc(s.folded ? "Сброшено" : name) : "Нет карт"}</b><span class="muted small">Стек ${fmt(s.stack)}${s.sittingOut ? " · ты отошёл" : ""}</span>` : `<b>Ты зритель</b><span class="muted small">${S.user ? "Нажми «Сесть» на свободном месте" : "Войди, чтобы играть"}</span>`}</div></div>`;
  z.innerHTML = handPart + `<div class="actions" id="actions"></div>`;
  S.actKey = "";
  renderActions();
}

function renderActions(force) {
  if (S.view !== "table") return;
  const box = $("actions"); if (!box) return;
  const t = TABLES.find((x) => x.id === S.table);
  const p = S.pubs[S.table]; if (!p) return;
  const mine = mySeatIdx(p), s = mine >= 0 ? p.seats[mine] : null;
  const myTurn = s && BETTING.includes(p.stage) && p.toAct === mine;
  const key = [p.handNo, p.stage, p.toAct, p.currentBet, s && s.stack, s && s.bet, S.busy].join("|");
  if (!force && key === S.actKey) return;
  S.actKey = key;
  if (!s) { box.innerHTML = ""; return; }
  if (!myTurn) {
    let txt = "";
    if (BETTING.includes(p.stage) && p.toAct >= 0 && p.seats[p.toAct]) txt = `Ходит ${esc(p.seats[p.toAct].name)}…`;
    else if (p.stage === "showdown") txt = "Следующая раздача скоро";
    else if (t.type === "tourney" && p.tourney.status === "waiting") txt = "Ждём старта турнира";
    else txt = "Ждём игроков";
    box.innerHTML = `<span class="waitline">${txt}</span>`;
    return;
  }
  const toCall = Math.min(p.currentBet - s.bet, s.stack);
  const maxTo = s.bet + s.stack;
  const minTo = Math.min(maxTo, p.currentBet + Math.max(p.minRaise, p.bb));
  const canRaise = maxTo > p.currentBet && !s.locked;
  const pot = potTotal(p);
  const word = p.currentBet === 0 ? "Ставка" : "Рейз до";
  const clamp = (v) => Math.max(minTo, Math.min(maxTo, Math.round(v)));
  const presets = [["Мин", minTo], ["½ банка", clamp(p.currentBet + (pot + toCall) / 2)], ["Банк", clamp(p.currentBet + pot + toCall)], ["Олл-ин", maxTo]];
  const dis = S.busy ? "disabled" : "";
  box.innerHTML = `
    <button class="btn red" type="button" data-m="fold" ${dis}>Пас</button>
    ${toCall > 0 ? `<button class="btn green" type="button" data-m="call" ${dis}>${toCall >= s.stack ? "Олл-ин " + fmt(toCall) : "Колл " + fmt(toCall)}</button>` : `<button class="btn green" type="button" data-m="check" ${dis}>Чек</button>`}
    ${canRaise ? `<div class="raise"><div class="presets">${presets.map(([n, v]) => `<button class="btn small" type="button" data-p="${v}" ${dis}>${n}</button>`).join("")}</div>
      <div class="row"><input type="range" id="rRange" min="${minTo}" max="${maxTo}" step="${p.bb >= 100 ? 10 : 1}" value="${minTo}">
      <input type="number" id="rNum" min="${minTo}" max="${maxTo}" value="${minTo}" inputmode="numeric" aria-label="Сумма">
      <button class="btn gold" type="button" data-m="raise" ${dis}>${word}</button></div></div>` : ""}`;
  const rr = $("rRange"), rn = $("rNum");
  if (rr) { rr.oninput = () => (rn.value = rr.value); rn.oninput = () => (rr.value = rn.value); }
  box.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => { rr.value = rn.value = b.dataset.p; }));
  box.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => {
    const m = b.dataset.m;
    if (m === "raise") { const v = Math.floor(+rn.value); run(v >= maxTo ? "act" : "act", v >= maxTo ? { table: S.table, move: "allin" } : { table: S.table, move: "raise", amount: v }); }
    else run("act", { table: S.table, move: m });
  }));
}

function tableCmd(a, p, t) {
  if (a === "lobby") return go("lobby");
  if (a === "leave") {
    const s = p.seats[mySeatIdx(p)];
    const msg = t.type === "tourney" && p.tourney.status === "running" ? "Сдаться и выбыть из турнира?" : s && s.inHand && BETTING.includes(p.stage) && !s.folded ? "Ты в раздаче: карты сбросятся. Встать из-за стола?" : null;
    if (msg && !confirm(msg)) return;
    return run("leave", { table: t.id }, t.type === "cash" ? "Фишки вернулись на баланс" : "");
  }
  if (a === "topup") return topupDialog(t, p);
  if (a === "tnew" && p.tourney.status === "running" && !confirm("Турнир ещё идёт. Сбросить его и начать запись заново?")) return;
  run(a, { table: t.id });
}

/* ───────── Диалоги ───────── */
function dialog(html, onOk) {
  const d = $("dlg"), f = $("dlgForm");
  f.innerHTML = html;
  f.onsubmit = (e) => { if (e.submitter && e.submitter.value === "ok") { e.preventDefault(); if (onOk() !== false) d.close(); } };
  d.showModal();
}
function sitDialog(t, p, seat) {
  if (!S.me) { toast("Профиль ещё грузится"); return; }
  if (t.type === "tourney") {
    dialog(`<h3>Записаться на турнир</h3><p class="muted">У всех будет по 10 000 турнирных фишек. Твой баланс не тратится. Турнир стартует, когда кто-нибудь нажмёт «Начать турнир».</p>
      <div class="row"><button class="btn" value="cancel">Отмена</button><button class="btn gold" value="ok">Записаться</button></div>`,
      () => { run("sit", { table: t.id, seat }); });
    return;
  }
  const bal = S.me.chips || 0;
  const max = Math.min(t.maxBuy, bal);
  if (max < t.minBuy) { toast(`Нужно минимум ${fmt(t.minBuy)} фишек, а у тебя ${fmt(bal)}. Попроси Сашу пополнить баланс.`); return; }
  const def = Math.min(max, Math.max(t.minBuy, Math.round(t.maxBuy / 2 / t.bb) * t.bb));
  dialog(`<h3>${esc(t.name)}: сколько берёшь за стол?</h3>
    <div class="buyval" id="bv">${fmt(def)}</div>
    <input type="range" id="br" min="${t.minBuy}" max="${max}" step="${t.bb}" value="${def}">
    <p class="muted small">На балансе ${fmt(bal)}. Когда встанешь, остаток вернётся на баланс.</p>
    <div class="row"><button class="btn" value="cancel">Отмена</button><button class="btn gold" value="ok">Сесть</button></div>`,
    () => { run("sit", { table: t.id, seat, buyIn: +$("br").value }); });
  $("br").oninput = () => ($("bv").textContent = fmt($("br").value));
}
function topupDialog(t, p) {
  const s = p.seats[mySeatIdx(p)]; if (!s) return;
  const bal = S.me ? S.me.chips || 0 : 0;
  const max = Math.min(t.maxBuy - s.stack, bal);
  if (max <= 0) { toast(s.stack >= t.maxBuy ? `За этим столом максимум ${fmt(t.maxBuy)}` : "На балансе нет фишек"); return; }
  const def = Math.max(1, Math.min(max, t.minBuy));
  dialog(`<h3>Докупить фишки</h3><div class="buyval" id="bv">${fmt(def)}</div>
    <input type="range" id="br" min="1" max="${max}" step="1" value="${def}">
    <p class="muted small">На балансе ${fmt(bal)}, за столом ${fmt(s.stack)}.</p>
    <div class="row"><button class="btn" value="cancel">Отмена</button><button class="btn gold" value="ok">Докупить</button></div>`,
    () => { run("topup", { table: t.id, amount: +$("br").value }); });
  $("br").oninput = () => ($("bv").textContent = fmt($("br").value));
}

/* ───────── Таймеры: ход, следующая раздача ───────── */
let tickTimer = null;
function scheduleTick(p, mine) {
  clearTimeout(tickTimer);
  if (!S.user || !S.worker || !p) return;
  const seated = mine >= 0;
  let at = 0, key = "";
  if (BETTING.includes(p.stage) && p.deadline) { at = p.deadline; key = "d" + p.handNo + p.stage + p.toAct + p.deadline; }
  else if (p.type === "tourney" && p.tourney.status !== "running") return;
  else if (p.stage === "showdown" && p.nextHandAt) { at = p.nextHandAt; key = "n" + p.handNo + p.nextHandAt; }
  else if (p.stage === "idle" && p.seats.filter((s) => s && s.stack > 0 && (p.type === "tourney" || !s.sittingOut)).length >= 2) { at = p.nextHandAt || now(); key = "i" + p.handNo + (p.nextHandAt || 0); }
  if (!at) return;
  // за столом тикают все сидящие, зрители — с запасом, чтобы стол не зависал
  const delay = Math.max(0, at - now()) + (seated ? 300 + mine * 250 : 6000);
  tickTimer = setTimeout(() => {
    if (S.lastTickKey === key && Date.now() - S.tickAt < 4000) return;
    S.lastTickKey = key; S.tickAt = Date.now();
    api("tick", { table: p.id }).catch(() => {});
  }, Math.min(delay, 60000));
}
setInterval(() => {
  if (S.view !== "table") return;
  const p = S.pubs[S.table]; if (!p || !BETTING.includes(p.stage) || !p.deadline) return;
  const el = document.querySelector("[data-timer]");
  if (el) el.style.width = (Math.max(0, p.deadline - now()) / TURN_MS) * 100 + "%";
}, 250);

let audioCtx = null;
function ping() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = 880; g.gain.value = 0.0001;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    o.stop(audioCtx.currentTime + 0.4);
  } catch {}
}
const baseTitle = document.title;
function maybeNotifyTurn(p, mine) {
  const myTurn = mine >= 0 && BETTING.includes(p.stage) && p.toAct === mine;
  const key = myTurn ? p.handNo + p.stage + p.currentBet : "";
  if (myTurn && key !== S.lastTurnKey) { ping(); if (document.hidden) document.title = "🔔 Твой ход!"; }
  if (!myTurn) document.title = baseTitle;
  S.lastTurnKey = key;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = baseTitle; });

function onPubChange(id) {

  if (S.view === "table" && S.table === id) renderTable();

}

      <p class="muted small">При сбросе обычного стола фишки игроков возвращаются на их балансы.</p>
      <h2 style="margin-top:16px">Свои радиостанции</h2>
      <div class="radiolist" id="rlist">${stationsEdit.map((s) => `<div class="r"><input type="text" value="${esc(s.title)}" data-rt><input type="text" value="https://youtu.be/${esc(s.vids[0])}" data-rv><button class="btn small" type="button" data-rdel>✕</button></div>`).join("")}</div>
      <div class="bankctl" style="margin-top:8px"><button class="btn small" type="button" id="rAdd">+ станция</button><button class="btn small gold" type="button" id="rSave">Сохранить радио</button></div>
      <p class="muted small">Вставь ссылку на трансляцию или видео с YouTube. Стандартные станции остаются всегда.</p>
      <h2 style="margin-top:16px">Сервер игры</h2>
      <div class="setup"><input type="url" id="wUrl" value="${esc(S.worker)}"><button class="btn small" id="wSave" type="button">Сохранить</button></div>
    </div></div>`;
  const m = $("main");
  m.querySelectorAll("[data-save]").forEach((b) => (b.onclick = () => run("adminSetChips", { uid: b.dataset.save, chips: +m.querySelector(`[data-set="${b.dataset.save}"]`).value }, "Баланс изменён")));
  m.querySelectorAll("[data-add]").forEach((b) => (b.onclick = () => run("adminAddChips", { uid: b.dataset.add, amount: +b.dataset.v })));
  $("allBtn").onclick = () => { if (confirm("Выставить всем одинаковый баланс?")) run("adminAll", { chips: +$("allV").value }, "Готово"); };
  m.querySelectorAll("[data-reset]").forEach((b) => (b.onclick = () => { if (confirm("Сбросить стол?")) run("adminResetTable", { table: b.dataset.reset }, "Стол сброшен"); }));
  m.querySelectorAll("[data-kick]").forEach((b) => (b.onclick = () => run("leave", { table: b.dataset.kick, uid: b.dataset.uid })));
  $("rAdd").onclick = () => { const d = document.createElement("div"); d.className = "r"; d.innerHTML = `<input type="text" placeholder="Название" data-rt><input type="text" placeholder="Ссылка YouTube" data-rv><button class="btn small" type="button" data-rdel>✕</button>`; $("rlist").append(d); };
  $("rlist").onclick = (e) => { if (e.target.closest("[data-rdel]")) e.target.closest(".r").remove(); };
  $("rSave").onclick = () => {
    const st = [...$("rlist").querySelectorAll(".r")].map((r) => ({ title: r.querySelector("[data-rt]").value.trim(), vid: ytId(r.querySelector("[data-rv]").value) })).filter((s) => s.vid);
    run("adminRadio", { stations: st }, "Радио сохранено");
  };
  $("wSave").onclick = saveWorker;
}
function ytId(s) {
  s = String(s || "").trim();
  const m = s.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/) || s.match(/^([A-Za-z0-9_-]{11})$/);
  return m ? m[1] : "";
}

/* ───────── Радио ───────── */
const R = { player: null, ready: false, playing: false, station: store.get("station", 0), vidIdx: 0, vol: store.get("vol", 45), apiLoading: false };
$("vol").value = R.vol;
$("radioKnob").onclick = () => { const p = $("radioPanel"); p.hidden = !p.hidden; $("radioKnob").setAttribute("aria-expanded", !p.hidden); };
$("vol").oninput = () => { R.vol = +$("vol").value; store.set("vol", R.vol); if (R.player && R.ready) R.player.setVolume(R.vol); };
function renderStations() {
  const box = $("stations"); if (!box) return;
  if (R.station >= S.stations.length) R.station = 0;
  box.innerHTML = S.stations.map((s, i) => `<button type="button" data-st="${i}" aria-pressed="${R.playing && R.station === i}">${R.playing && R.station === i ? "⏸ " : "▶ "}${esc(s.title)}</button>`).join("");
  box.querySelectorAll("[data-st]").forEach((b) => (b.onclick = () => toggleStation(+b.dataset.st)));
  $("radioLabel").textContent = R.playing ? S.stations[R.station].title : "Радио";
  $("radio").classList.toggle("playing", R.playing);
}
function loadYT(cb) {
  if (window.YT && window.YT.Player) return cb();
  window.onYouTubeIframeAPIReady = cb;
  if (R.apiLoading) return; R.apiLoading = true;
  const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => toast("YouTube не загрузился — радио недоступно");
  document.head.append(s);
}
function toggleStation(i) {
  if (R.playing && R.station === i) { R.playing = false; if (R.player && R.ready) R.player.pauseVideo(); renderStations(); return; }
  R.station = i; R.vidIdx = 0; store.set("station", i); R.playing = true; renderStations();
  loadYT(() => playCurrent());
}
function playCurrent() {
  const st = S.stations[R.station]; const vid = st.vids[R.vidIdx % st.vids.length];
  if (!R.player) {
    R.player = new YT.Player("yt", { width: 2, height: 2, videoId: vid,
      playerVars: { autoplay: 1, controls: 0, playsinline: 1, disablekb: 1, fs: 0, rel: 0 },
      events: {
        onReady: (e) => { R.ready = true; e.target.setVolume(R.vol); if (R.playing) e.target.playVideo(); },
        onError: () => { R.vidIdx++; if (R.vidIdx < st.vids.length) R.player.loadVideoById(S.stations[R.station].vids[R.vidIdx]); else { toast("Эта станция сейчас не играет, выбери другую"); R.playing = false; renderStations(); } },
        onStateChange: (e) => { if (e.data === 0 && R.playing) R.player.playVideo(); },
      } });
  } else if (R.ready) { R.player.loadVideoById(vid); R.player.setVolume(R.vol); }
}
renderStations();

let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.view === "table") renderTable(); }, 150); });

/* ───────── Старт ───────── */
fromHash();
if (initFirebase()) render();
})();
</script>
</body>
</html>
